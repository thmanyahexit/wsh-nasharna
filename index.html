<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>وش نشرنا هالأسبوع</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f0f0f;--fg:#fff;--muted:#a3a3a3;--accent:#f4c430;--card:#1b1b1b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000}
  #story{width:1080px;height:1920px;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans Arabic',sans-serif;
    display:flex;flex-direction:column;padding:120px 80px 100px;overflow:hidden;position:relative}
  header h1{font-size:96px;font-weight:700;line-height:1.1}
  header h1 span{color:var(--accent)}
  header p{font-size:36px;color:var(--muted);margin-top:16px}
  #list{flex:1;display:grid;gap:44px;margin-top:70px;align-content:center}
  .ep{display:flex;flex-direction:column;gap:20px}
  .media{position:relative;width:100%;aspect-ratio:16/9;border-radius:28px;overflow:hidden;background:var(--card)}
  .media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
  .num{position:absolute;top:20px;right:20px;background:var(--accent);color:#000;font-weight:700;font-size:34px;
    width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
  .title{font-size:40px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  footer{display:flex;justify-content:space-between;align-items:center;font-size:34px;color:var(--muted);margin-top:50px}
  footer b{color:var(--fg)}
  /* adaptive layouts */
  .n1 .title{font-size:56px}
  .n2 .media{width:90%;margin-inline:auto}
  .n3 .ep{flex-direction:row;align-items:center;gap:32px}
  .n3 .media{width:520px;flex:none}
  .n3 .title{font-size:38px;-webkit-line-clamp:4}
  .many{grid-template-columns:1fr 1fr;gap:40px 36px}
  .many .title{font-size:30px}
  .many .num{width:52px;height:52px;font-size:28px}
  .empty{font-size:48px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="story">
  <header>
    <h1>وش نشرنا <span>هالأسبوع</span></h1>
    <p id="range"></p>
  </header>
  <div id="list"></div>
  <footer><span>شوفها كاملة على يوتيوب</span><b dir="ltr">@thmanyahexit</b></footer>
</div>
<script>
const fmt = d => new Date(d).toLocaleDateString('ar-SA-u-ca-gregory-nu-arab',{day:'numeric',month:'long'});
fetch('episodes.json?'+Date.now()).then(r=>r.json()).then(data=>{
  document.getElementById('range').textContent = `${fmt(data.from)} – ${fmt(data.to)}`;
  const list = document.getElementById('list'), eps = data.episodes;
  const n = eps.length;
  list.className = n===0 ? '' : n<=3 ? 'n'+n : 'many';
  if(!n){ list.innerHTML='<p class="empty">ما فيه حلقات جديدة هالأسبوع</p>'; document.body.dataset.ready = '1'; return; }
  const ar = i => (i+1).toLocaleString('ar-SA');
  list.innerHTML = eps.slice(0,6).map((e,i)=>`
    <div class="ep">
      <div class="media">
        ${e.clip ? `<video src="${e.clip}" poster="${e.thumb}" autoplay muted loop playsinline></video>`
                 : `<img src="${e.thumb}" alt="">`}
        <div class="num">${ar(i)}</div>
      </div>
      <div class="title">${e.title}</div>
    </div>`).join('');
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
